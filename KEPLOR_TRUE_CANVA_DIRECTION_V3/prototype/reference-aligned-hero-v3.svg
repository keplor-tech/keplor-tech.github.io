<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050507"/><stop offset="1" stop-color="#06050b"/></linearGradient>
 <radialGradient id="blue"><stop stop-color="#007fce" stop-opacity=".75"/><stop offset=".38" stop-color="#0756a9" stop-opacity=".35"/><stop offset="1" stop-color="#064fa7" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#7534d7" stop-opacity=".65"/><stop offset=".45" stop-color="#4d168c" stop-opacity=".27"/><stop offset="1" stop-color="#48118d" stop-opacity="0"/></radialGradient>
 <radialGradient id="cyan"><stop stop-color="#00b8ca" stop-opacity=".4"/><stop offset="1" stop-color="#00b8ca" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="72"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values=".35 0 0 0 .1 .35 0 0 0 .1 .35 0 0 0 .1 0 0 0 .14 0"/></filter>
 </defs>
<rect width="1600" height="900" fill="url(#base)"/>
<!-- Diffuse, amorphous light only: these fields are intentionally blurred into the canvas. -->
<g>
